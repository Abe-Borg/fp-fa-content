# Publish a content pack when a content-v* tag is pushed.
# Assets: manifest.json and fp-fa-content-v<version>.zip.

name: Content pack

on:
  push:
    tags:
      - "content-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build content pack
        run: |
          version="${GITHUB_REF_NAME#content-v}"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > pack-notes.txt
          python3 scripts/build_content_pack.py \
            --version "$version" \
            --out dist \
            --changelog-file pack-notes.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/manifest.json dist/*.zip --clobber
          else
            gh release create "$tag" \
              dist/manifest.json \
              dist/*.zip \
              --title "$tag" \
              --notes-file dist/changelog.txt
          fi

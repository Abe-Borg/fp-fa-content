# Publish a content pack when a content-v* tag is pushed.
# Assets: manifest.json and fp-fa-content-v<version>.zip.

name: Content pack

on:
  push:
    tags:
      - "content-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A tag used to publish whatever the tree held. The calc suites and the pack lint run first now: a pack
      # whose prose names low air as a release input, or that lost a recorded correction, is not published.
      - name: Test the content before it is packed
        run: |
          (cd calcs/fp && python -m unittest discover -s . -p 'test_*.py')
          (cd calcs/fa && python -m unittest discover -s tests)

      - name: Build content pack
        run: |
          version="${GITHUB_REF_NAME#content-v}"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > pack-notes.txt
          python3 scripts/build_content_pack.py \
            --version "$version" \
            --out dist \
            --changelog-file pack-notes.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/manifest.json dist/*.zip --clobber
            gh release edit "$tag" --latest --notes-file dist/changelog.txt
          else
            gh release create "$tag" \
              dist/manifest.json \
              dist/*.zip \
              --title "$tag" \
              --latest \
              --notes-file dist/changelog.txt
          fi

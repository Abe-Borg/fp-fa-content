# Publish a content pack when a content-v* tag is pushed.
# Assets: manifest.json and fp-fa-content-v<version>.zip.
#
# A tag publishes only when its commit is on main, its version is above every earlier content tag on main,
# and the repository's owner pushed it (scripts/check_content_tag.py); any other tag fails this job before
# anything is built.
# The calc suites, the pack lint, and the app suite run before the pack is built.
# The kernel reproduce check is a hand run attached to the release manifest: FP_KERNEL_DIR is not set here.

name: Content pack

on:
  push:
    tags:
      - "content-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A tag on a branch that was never merged, or on a commit main no longer holds, publishes nothing.
      - name: Refuse a tag that is not on main
        env:
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          # Every earlier content tag, so the gate can refuse a version that is not above the latest on main.
          git fetch --force --tags origin
          python3 scripts/check_content_tag.py \
            --tag "$GITHUB_REF_NAME" \
            --main-ref refs/remotes/origin/main \
            --actor "$ACTOR" \
            --owner "$OWNER"

      - name: Install the app's dependencies
        run: python -m pip install -r app/requirements.txt

      # A tag used to publish whatever the tree held. The calc suites and the pack lint run first now: a pack
      # whose prose names low air as a release input, or that lost a recorded correction, is not published.
      # The app suite runs too: it loads the pack the way an installed app does. Every agent in it is scripted.
      - name: Test the content and the app before the pack is built
        run: |
          (cd calcs/fp && python -m unittest discover -s . -p 'test_*.py')
          (cd calcs/fa && python -m unittest discover -s tests)
          (cd app && python -m unittest discover -s tests)

      - name: Build content pack
        run: |
          version="${GITHUB_REF_NAME#content-v}"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > pack-notes.txt
          python3 scripts/build_content_pack.py \
            --version "$version" \
            --out dist \
            --changelog-file pack-notes.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/manifest.json dist/*.zip --clobber
            gh release edit "$tag" --latest --notes-file dist/changelog.txt
          else
            gh release create "$tag" \
              dist/manifest.json \
              dist/*.zip \
              --title "$tag" \
              --latest \
              --notes-file dist/changelog.txt
          fi
